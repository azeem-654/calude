<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRMPro — Everything it takes to win the next customer</title>
    <!--
      protectedcentral.com is a page people will be sent links to, so it carries
      the description and the card that a link preview shows. The same document
      boots the app on app.protectedcentral.com; that side is behind a login and
      is not somewhere a search engine can reach, so one set of tags serves both
      and the canonical belongs to the public one.
    -->
    <meta name="description" content="Find the people worth contacting, write to them, book the meeting and see what actually worked — sales, marketing, sites and content in one place, sending on your own mailbox." />
    <link rel="canonical" href="https://protectedcentral.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRMPro" />
    <meta property="og:url" content="https://protectedcentral.com/" />
    <meta property="og:title" content="CRMPro — Everything it takes to win the next customer" />
    <meta property="og:description" content="Sales, marketing, sites and content in one place. Every step visible and editable before it happens, sending on your own mailbox." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f1210" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
