# ──────────────────────────────────────────────────────────────────────────────
# Deploy to Cloudflare
#
# Replaces the FTP workflows this repo used to carry. Those uploaded a folder
# of built files and a folder of PHP; there is no PHP any more, and nothing is
# uploaded — `wrangler deploy` publishes the Worker, which serves both the
# built app and the whole API.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with Account → Workers Scripts: Edit,
#                          Account → D1: Edit, Account → Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  the account id from the Cloudflare dashboard
#
# The custom domain is attached at the account level and is deliberately not
# declared in wrangler.jsonc — declaring it makes every deploy call the zone
# route API, a separate permission, and fails the run even when the code
# published fine.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two runs racing would publish in whichever order they
# happened to finish, which is not necessarily the order they were pushed.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4.127 refuses to start on anything below Node 22 — the deploy
      # that pinned 20 built the app, then fell over on the first wrangler
      # command, so nothing has shipped since. This is the floor wrangler
      # states, not a preference.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── The secrets, before anything expensive ──────────────────────────
      #
      # These were empty for a while and nothing said so. The run installed,
      # typechecked and built — ninety seconds of green ticks — and then wrangler
      # failed with "it's necessary to set a CLOUDFLARE_API_TOKEN environment
      # variable", which reads like a wrangler problem rather than a missing
      # repository secret. Worse, the *migrations* step is the one that hit it
      # first, so the failure pointed at the database.
      #
      # A missing secret is knowable in the first second of the run. Checking it
      # here costs nothing and names the exact thing to go and set.
      - name: Check the Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Cloudflare credentials missing::Repository secret(s) not set:$missing"
            echo ""
            echo "Set them at Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "The token needs Workers Scripts: Edit, D1: Edit and Account Settings: Read."
            echo "Nothing was deployed and the database was not touched."
            exit 1
          fi
          echo "Both credentials are present."

      - name: Install dependencies
        run: npm ci

      # Types are checked before anything is published. The root tsconfig is a
      # solution file, so a bare `tsc --noEmit` compiles nothing and passes
      # regardless — `tsc -b` is the one that actually checks.
      - name: Typecheck the app
        run: npm run typecheck

      - name: Typecheck the Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      # VITE_BASE=/ because the app is served from the domain root here, not
      # from a subpath as it was on GitHub Pages.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      # Migrations first: a Worker that expects a column its database does not
      # have yet is a broken deploy, and this ordering makes that impossible.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply crmpro --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
