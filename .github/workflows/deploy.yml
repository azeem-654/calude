# ──────────────────────────────────────────────────────────────────────────────
# FTP Deploy to Freehostia
#
# FTP chroot root = /www/protectedcentral.com/ (filesystem)
#
# Branches → FTP server-dir → serves at
#   testing  →  /www/testing.protectedcentral.com/  →  testing.protectedcentral.com
#   main     →  /                                   →  protectedcentral.com / go.protectedcentral.com
#
# Required GitHub Secrets:
#   FTP_HOST      protectedcentral.com
#   FTP_USER      main654_protectedcentral.com
#   FTP_PASSWORD  <your password>
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Freehostia (FTP)

on:
  push:
    branches:
      - testing
      - main
  workflow_dispatch:
    inputs:
      branch_override:
        description: 'Force deploy target (testing | live)'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install ───────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Determine deploy target ───────────────────────────────────────────
      - name: Resolve deploy target directory
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "dir=/"                                      >> "$GITHUB_OUTPUT"
            echo "env=live"                                   >> "$GITHUB_OUTPUT"
            echo "label=LIVE → protectedcentral.com"         >> "$GITHUB_OUTPUT"
          else
            echo "dir=/www/testing.protectedcentral.com/"    >> "$GITHUB_OUTPUT"
            echo "env=testing"                               >> "$GITHUB_OUTPUT"
            echo "label=TESTING → testing.protectedcentral.com" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        env:
          VITE_BASE: /
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      # ── 6. FTP Upload (Freehostia FTP is flaky — retry up to 3 times) ────────
      - name: Deploy via FTP → ${{ steps.target.outputs.label }} (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USER }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          security:    loose
          log-level:   verbose
          timeout:     120000
          local-dir:   ./dist/
          server-dir:  ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map

      - name: Wait before retry
        if: steps.ftp1.outcome == 'failure'
        run: echo "First FTP attempt timed out — waiting 45s for the server to recover..." && sleep 45

      - name: Deploy via FTP (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USER }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          security:    loose
          log-level:   verbose
          timeout:     120000
          local-dir:   ./dist/
          server-dir:  ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map

      - name: Wait before final retry
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: echo "Second FTP attempt timed out — waiting 90s before the final attempt..." && sleep 90

      - name: Deploy via FTP (attempt 3 — final)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USER }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        21
          security:    loose
          log-level:   verbose
          timeout:     120000
          local-dir:   ./dist/
          server-dir:  ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map

      # ── 7. Reachability probe ────────────────────────────────────────────────
      # An FTP upload only proves port 21 answered. This checks the site the way
      # a visitor would, from a network that is neither the developer's nor the
      # host's, and separates the causes of a failure — a filtered port, a dead
      # TLS listener, an expired certificate — because they have different fixes.
      # Never fails the job: a red deploy on a probe failure would hide the fact
      # that the upload itself succeeded.
      - name: Probe the live site
        if: always()
        continue-on-error: true
        run: bash scripts/site-check.sh protectedcentral.com

      # ── 8. Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "### ✅ Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | **${{ steps.target.outputs.env }}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FTP target | \`${{ steps.target.outputs.dir }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
