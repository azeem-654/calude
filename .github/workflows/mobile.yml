# ──────────────────────────────────────────────────────────────────────────────
# Build the phone apps — Protected Central and PC Support — for Android and iPhone
#
# Run it from Actions → "Build phone apps" → Run workflow. It never publishes
# anything to a store by itself except, when the Apple keys are set, an upload
# to App Store Connect (which only appears in TestFlight until you submit it).
#
# Android: a signed .aab for Google Play and a signed .apk to install directly,
#          attached to the run as an artifact. Signed only when the
#          ANDROID_KEYSTORE_* secrets are set (docs/MOBILE-APPS.md, part 2).
#          With GOOGLE_SERVICES_JSON set, the build can receive push alerts.
# iPhone:  with APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8
#          and APPLE_TEAM_ID set, archived, signed by Xcode's automatic signing
#          and uploaded to App Store Connect. Without them it is still compiled
#          (unsigned), so a broken iPhone build is found before anyone needs it.
#
# The apps load app.protectedcentral.com, so a web release reaches them without
# a new build. Rebuild only when something in mobile/ changes, or to bump the
# version a store asks for.
# ──────────────────────────────────────────────────────────────────────────────

name: Build phone apps

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Which apps'
        type: choice
        options: [both, customer, support]
        default: both
      platforms:
        description: 'Which platforms'
        type: choice
        options: [both, android, ios]
        default: both
      version_name:
        description: 'Version people see (e.g. 1.0.1)'
        default: '1.0'
      version_code:
        description: 'Build number — must go up every upload (e.g. 2)'
        default: '1'

concurrency:
  group: mobile-build
  cancel-in-progress: false

# `shell: bash` runs with -eo pipefail, so `xcodebuild … | tail` fails when
# xcodebuild does; the runner's default shell has no pipefail and would not.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.p.outputs.apps }}
    steps:
      - id: p
        run: |
          case "${{ inputs.apps }}" in
            both) echo 'apps=["customer","support"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo "apps=[\"${{ inputs.apps }}\"]" >> "$GITHUB_OUTPUT" ;;
          esac

  android:
    needs: plan
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install Capacitor
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Firebase config (push alerts), when set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "mobile/${{ matrix.app }}/android/app/google-services.json"
            echo "Push alerts: on"
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set — this Android build alerts only while the app is open."
          fi
      - name: Upload key, when set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the release build is unsigned and Google Play will not accept it."
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mobile/build.sh "${{ matrix.app }}" release "${{ inputs.version_code }}" "${{ inputs.version_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            mobile/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
            mobile/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    needs: plan
    if: inputs.platforms != 'android'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Capacitor
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Sync the iOS project
        working-directory: mobile/${{ matrix.app }}
        run: npx cap sync ios
      - name: Apple keys present?
        id: keys
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ -n "$TEAM" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple keys are not set — compiling the iPhone app unsigned to prove it builds. docs/MOBILE-APPS.md, part 3."
          fi
      - name: Compile (unsigned)
        if: steps.keys.outputs.signed != 'true'
        working-directory: mobile/${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ inputs.version_name }}" CURRENT_PROJECT_VERSION="${{ inputs.version_code }}" \
            archive | tail -40
      - name: Archive, sign and upload to App Store Connect
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/${{ matrix.app }}/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version_name }}" CURRENT_PROJECT_VERSION="${{ inputs.version_code }}" \
            $AUTH archive | tail -40
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            "<key>teamID</key><string>$TEAM</string>" \
            '<key>signingStyle</key><string>automatic</string>' \
            '<key>uploadSymbols</key><true/>' \
            '</dict></plist>' > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -40
          echo "::notice::Uploaded to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)."
