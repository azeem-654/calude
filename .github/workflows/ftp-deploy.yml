# Superseded by deploy.yml — kept here for manual-dispatch only.
# This file does NOT auto-trigger on push.

name: FTP Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target: testing or live'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
      - name: Resolve target directory
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "live" ]; then
            echo "dir=/www/protectedcentral.com/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/www/testing.protectedcentral.com/" >> "$GITHUB_OUTPUT"
          fi
      - name: FTP Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.0.0
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USER }}
          password:    ${{ secrets.FTP_PASSWORD }}
          local-dir:   ./dist/
          server-dir:  ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
