# ──────────────────────────────────────────────────────────────────────────────
# Site check — is protectedcentral.com reachable, and if not, why?
#
# Run it from the Actions tab whenever the site looks down. It answers from
# GitHub's network, which is neither your machine nor the host's, so it can tell
# "the site is down" apart from "the site is down for me".
#
# The scheduled run means an outage is noticed before a customer reports it.
# It only reads — nothing here writes to the server.
# ──────────────────────────────────────────────────────────────────────────────

name: Site check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to check'
        required: false
        default: 'protectedcentral.com'
  schedule:
    - cron: '0 6,18 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: bash scripts/site-check.sh "${{ github.event.inputs.domain || 'protectedcentral.com' }}"
