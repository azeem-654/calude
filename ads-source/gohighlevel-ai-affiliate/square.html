<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .stage {
    width:1080px; height:1080px; position:relative;
    background: radial-gradient(700px 500px at 78% 15%, #123b3a 0%, #0a1622 55%, #060b12 100%);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .glow { position:absolute; border-radius:50%; filter: blur(90px); opacity:0.55; }
  .glow1 { width:460px; height:460px; background:#1fd1a8; top:-140px; right:-100px; }
  .glow2 { width:420px; height:420px; background:#2451ff; bottom:-160px; left:-100px; opacity:0.35; }

  .content { position:relative; z-index:2; width:900px; text-align:center; }

  .kicker {
    display:inline-block; padding:10px 26px; border-radius:999px;
    background:rgba(31,209,168,0.12); border:2px solid rgba(31,209,168,0.55);
    color:#5ff0cd; font-size:19px; font-weight:700; letter-spacing:1px;
    margin-bottom:26px;
  }
  .headline { font-size:58px; font-weight:800; line-height:1.12; letter-spacing:-0.5px; margin-bottom:22px; }
  .headline.tight { font-size:50px; }
  .headline .accent { color:#33e6bd; }
  .sub { font-size:27px; font-weight:400; color:#c8d3d8; line-height:1.4; max-width:820px; margin:0 auto; }

  .crossrow { display:flex; gap:16px; justify-content:center; margin-top:34px; flex-wrap:wrap; }
  .crosschip {
    display:flex; align-items:center; gap:10px; padding:12px 20px; border-radius:14px;
    background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.12);
    font-size:20px; color:#9fb0b8; position:relative;
  }
  .crosschip::after {
    content:""; position:absolute; left:10px; right:10px; top:50%; height:3px; background:#ff5d6c; border-radius:4px;
  }

  .featlist { display:flex; flex-direction:column; gap:22px; text-align:left; margin-top:14px; }
  .feat { display:flex; align-items:flex-start; gap:20px; }
  .tick {
    flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:#1fd1a8;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#06231c; font-weight:900;
  }
  .feat-text { font-size:28px; font-weight:600; color:#eef7f5; line-height:1.3; padding-top:4px; }
  .feat-text b { color:#33e6bd; }

  .offercard {
    background:linear-gradient(135deg, rgba(31,209,168,0.16), rgba(36,81,255,0.10));
    border:3px solid rgba(51,230,189,0.65); border-radius:28px; padding:44px 50px;
  }
  .offer-top { font-size:22px; font-weight:700; color:#8be6cf; letter-spacing:1.5px; margin-bottom:16px; }
  .offer-amt { font-size:66px; font-weight:900; color:#fff; margin-bottom:8px; }
  .offer-amt span { color:#33e6bd; }
  .offer-desc { font-size:26px; color:#dbeae6; font-weight:500; }
  .offer-fine { font-size:16px; color:#7f9490; margin-top:20px; line-height:1.5; }

  .ctaurl {
    font-size:32px; font-weight:800; color:#fff; margin-top:6px;
    background:rgba(255,255,255,0.08); display:inline-block; padding:14px 34px; border-radius:14px;
    border:2px solid rgba(255,255,255,0.18);
  }
  .ctabtn {
    margin-top:30px; display:inline-block; padding:22px 58px; border-radius:16px;
    background:#1fd1a8; color:#04241d; font-size:32px; font-weight:800;
  }
  .fine { margin-top:28px; font-size:16px; color:#7f9490; }

  .wordmark { font-size:52px; font-weight:800; letter-spacing:-1px; }
  .wordmark.big { font-size:60px; }
  .wordmark .go { color:#fff; }
  .wordmark .high { color:#33e6bd; }

  .pagegroup { position:absolute; bottom:34px; left:0; right:0; display:flex; justify-content:center; gap:10px; z-index:3; }
  .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.25); }
  .dot.active { background:#33e6bd; width:26px; border-radius:6px; }

  .swipe { position:absolute; top:40px; right:40px; z-index:3; font-size:18px; color:#7f9490; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); padding:10px 18px; border-radius:999px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="content" id="content"></div>
    <div id="chrome"></div>
  </div>
</body>
</html>
