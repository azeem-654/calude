<!--
  Protected Central.

  A shield with its centre cut out — "protected" and "central" in one figure,
  and the hole is what makes it legible at 16px, where an engraved or outlined
  mark turns to mush. Two shapes, one hole, no strokes and no filters: browsers
  rasterise this cleanly at every tab size, and it survives being scaled down to
  a bookmark bar.

  The dark tile is not decoration. A lime mark on transparency disappears against
  a light tab strip and glows against a dark one; the tile means the icon looks
  the same in both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Protected Central">
  <defs>
    <linearGradient id="pc" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6f96f"/>
      <stop offset="0.55" stop-color="#c8f24d"/>
      <stop offset="1" stop-color="#8fd9c4"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#0f1210"/>

  <!--
    The shield and the hole are one path with two subpaths wound in opposite
    directions, so the even-odd rule punches the centre out. A separate dark
    circle on top would look identical here and wrong the moment the icon is
    dropped on any other colour.
  -->
  <path fill="url(#pc)" fill-rule="evenodd" d="
    M16 4.6
    L25.4 8.1
    V16.2
    C25.4 21.6 21.6 25.9 16 27.9
    C10.4 25.9 6.6 21.6 6.6 16.2
    V8.1
    Z
    M16 12.2
    a3.9 3.9 0 1 0 0 7.8
    a3.9 3.9 0 1 0 0 -7.8
    Z
  "/>
</svg>
